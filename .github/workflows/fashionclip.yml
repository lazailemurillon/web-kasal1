name: FashionCLIP Worker

run-name: FashionCLIP ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      photo_path:
        description: "Path of uploaded photo inside the repository"
        required: true
        type: string

      job_id:
        description: "Unique ID for this AI search"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fashionclip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fashion-clip==0.2.2
          pip install torch==2.13.0
          pip install transformers==4.30.2
          pip install numpy==1.26.4
          pip install Pillow==12.3.0
          pip install requests

      - name: Run FashionCLIP worker
        env:
          PHOTO_PATH: ${{ inputs.photo_path }}
        run: |
          python fashionclip_worker/run_fashionclip.py

      - name: Send result to Django
        env:
          DJANGO_CALLBACK_URL: https://web-kasal1-production.up.railway.app/api/fashionclip/callback/
          DJANGO_CALLBACK_SECRET: ${{ secrets.DJANGO_CALLBACK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          result_file = "fashionclip_worker/fashion_results.json"

          with open(result_file, "r", encoding="utf-8") as f:
              result = json.load(f)

          callback_url = os.environ["DJANGO_CALLBACK_URL"]
          callback_secret = os.environ["DJANGO_CALLBACK_SECRET"]

          print(f"Sending result to: {callback_url}")
          print(f"Job ID: {os.environ['JOB_ID']}")

          response = requests.post(
              callback_url,
              headers={
                  "Authorization": f"Bearer {callback_secret}"
              },
              json={
                  "job_id": os.environ["JOB_ID"],
                  "result": result
              },
              timeout=60
          )

          print(f"Django response: {response.status_code}")
          print(response.text)

          response.raise_for_status()

          print("FashionCLIP result successfully sent to Django.")
          PY