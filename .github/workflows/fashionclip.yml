name: FashionCLIP Worker

run-name: FashionCLIP ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      photo_path:
        description: "Path of uploaded photo inside the repository"
        required: true
        type: string

      job_id:
        description: "Unique ID for this AI search"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fashionclip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fashion-clip==0.2.2
          pip install torch==2.13.0
          pip install transformers==4.30.2
          pip install numpy==1.26.4
          pip install Pillow==12.3.0

      - name: Run FashionCLIP worker
        env:
          PHOTO_PATH: ${{ inputs.photo_path }}
        run: |
          python fashionclip_worker/run_fashionclip.py

      - name: Rename result for this job
        run: |
          mv fashionclip_worker/fashion_results.json \
             fashionclip_worker/result_${{ inputs.job_id }}.json

      - name: Save AI result to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fashionclip_worker/result_${{ inputs.job_id }}.json

          git commit -m "Save FashionCLIP result ${{ inputs.job_id }}"

          git push